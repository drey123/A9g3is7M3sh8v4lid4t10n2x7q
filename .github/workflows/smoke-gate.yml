name: aegismesh-smoke-gate

# AegisMesh firmware-validation smoke gate (task.md "Firmware Validation
# Infrastructure"). This repo holds ONLY disposable workflow YAML + minimal
# test fixtures - no product source of truth, no decision ledger, no
# research.md. The private repo drey123/Aegismesh remains the source of
# truth; run URLs + status are appended to its research.md by the launching
# agent after each run.
#
# Two stages:
#   selfcontained - SLO-canary arithmetic + LR2021 skeleton compile; needs
#                   no secrets, runs on every push.
#   (ITER-13: fuzz gate is now a 4-harness family - headerv2, witness,
#    sdio-slot, ble-envelope - one job per harness, 100k iterations each.)
#   full-sim      - checks out the PRIVATE repo sim/ and runs the seeded
#                   DES/MC smoke profile; activates automatically once the
#                   repo secret GH_PAT (fine-grained PAT with Contents:read
#                   on drey123/Aegismesh) is configured by the owner.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  selfcontained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SLO canary (closed-form anchors)
        run: python3 slo_canary.py
      - name: LR2021 Renode skeleton compile check
        run: |
          python3 -m py_compile lr2021_peripheral.py
          echo "LR2021 skeleton compiles; register-accurate timing pending"

  csharp-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build LR2021 C# model (against stubs)
        run: dotnet build lr2021.csproj -v q
      - name: Run LR2021 timing-anchor selftest
        run: dotnet run --project lr2021.csproj --no-build

  iter6-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build ITER-6 arithmetic anchors
        run: dotnet build iter6.csproj -v q
      - name: Run ITER-6 anchor selftest (DP audit + spill contention)
        run: dotnet run --project iter6.csproj --no-build

  iter7-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build ITER-7 arithmetic anchors
        run: dotnet build iter7.csproj -v q
      - name: Run ITER-7 anchor selftest (island accrual custody model)
        run: dotnet run --project iter7.csproj --no-build

  iter8-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build ITER-8 arithmetic anchors
        run: dotnet build iter8.csproj -v q
      - name: Run ITER-8 anchor selftest (conditional-binary policy kernel)
        run: dotnet run --project iter8.csproj --no-build

  iter9-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build ITER-9 arithmetic anchors
        run: dotnet build iter9.csproj -v q
      - name: Run ITER-9 anchor selftest (m-hat estimator + quotas)
        run: dotnet run --project iter9.csproj --no-build

  iter10-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build ITER-10 arithmetic anchors
        run: dotnet build iter10.csproj -v q
      - name: Run ITER-10 anchor selftest (spray-est + EDA + Alloy)
        run: dotnet run --project iter10.csproj --no-build

  fuzz-smoke:
    # Owner mandate: parser-fuzzing gate, >= 100,000 iterations per push
    # (task.md "Parser fuzzing and security regression gates").  Harness:
    # HeaderV2 16-byte proposal + 12-byte baseline structural parser,
    # deterministic seed, P1-P4 property checks under ASan/UBSan.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzz harness (ASan + UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
              -fno-sanitize-recover=all fuzz_headerv2.c -o fuzz_headerv2
      - name: Run 100k-iteration smoke fuzz
        run: ./fuzz_headerv2 | tee fuzz_smoke.log
      - name: Assert smoke-fuzz anchor counts (deterministic seed 0x542)
        run: |
          grep -q "iters=100000" fuzz_smoke.log
          grep -q "ALL PROPERTIES PASS (P1-P4), coverage complete" fuzz_smoke.log
          echo "fuzz gate: 100000 iterations, 0 crashes, coverage complete"

  fuzz-witness:
    # ITER-13 harness family (task.md "Parser fuzzing and security
    # regression gates"): 16-byte witness receipt (MAC-006: 8 B msg-id hash
    # + 4 B hop MAC + 4 B CRC-32 LE over [0:12]).  Deterministic seed 0x542,
    # 100,000 iterations, properties P1-P4 under ASan/UBSan.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build witness-receipt fuzz harness (ASan + UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
              -fno-sanitize-recover=all fuzz_witness16.c -o fuzz_witness16
      - name: Run 100k-iteration smoke fuzz
        run: ./fuzz_witness16 | tee fuzz_witness.log
      - name: Assert anchors (deterministic seed 0x542)
        run: |
          grep -q "iters=100000" fuzz_witness.log
          grep -q "ALL PROPERTIES PASS (P1-P4), coverage complete" fuzz_witness.log
          echo "witness-receipt fuzz gate: 100000 iterations, 0 crashes, coverage complete"

  fuzz-sdio:
    # ITER-13 harness family: 512-byte SDIO slot framing (FW-002:
    # [len:2 | flags:1 | ring_seq:1 | payload:<=504 | CRC32:4], EOT +
    # crypto-required flags, reserved bits zero).  Seed 0x542, 100,000
    # iterations, P1-P4 under ASan/UBSan.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build SDIO-slot fuzz harness (ASan + UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
              -fno-sanitize-recover=all fuzz_sdio_slot.c -o fuzz_sdio_slot
      - name: Run 100k-iteration smoke fuzz
        run: ./fuzz_sdio_slot | tee fuzz_sdio.log
      - name: Assert anchors (deterministic seed 0x542)
        run: |
          grep -q "iters=100000" fuzz_sdio.log
          grep -q "ALL PROPERTIES PASS (P1-P4), coverage complete" fuzz_sdio.log
          echo "sdio-slot fuzz gate: 100000 iterations, 0 crashes, coverage complete"

  fuzz-envelope:
    # ITER-13 harness family: BLE/Nostr transport envelope, BitChat-anchored
    # v1 frame (whitepaper v2.0 section 4.1/4.2; byte widths pinned from
    # BinaryProtocol.swift) + AegisMesh overlays: 16 KiB envelope cap (O1,
    # task.md quota baseline) and TTL in [1,7] (O2, PR #998 lesson).
    # v2 source-route frames out of scope (stated scoping).  Seed 0x542,
    # 100,000 iterations, P1-P5 under ASan/UBSan.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build BLE-envelope fuzz harness (ASan + UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
              -fno-sanitize-recover=all fuzz_ble_envelope.c -o fuzz_ble_envelope
      - name: Run 100k-iteration smoke fuzz
        run: ./fuzz_ble_envelope | tee fuzz_envelope.log
      - name: Assert anchors (deterministic seed 0x542)
        run: |
          grep -q "iters=100000" fuzz_envelope.log
          grep -q "ALL PROPERTIES PASS (P1-P5), coverage complete" fuzz_envelope.log
          echo "ble-envelope fuzz gate: 100000 iterations, 0 crashes, coverage complete"

  fuzz-aead:
    # ITER-14 AEAD-boundary reference contract (task.md parser-fuzzing
    # mandate's boundary half + ITER-13 new bottleneck #2): pins the SEC-001
    # AEAD call-site doctrine - D1 all 16 header bytes are AAD (exhaustive
    # bit sweep), D2 96-bit nonce = (epoch|direction) prefix || monotone
    # counter, uniqueness at seal, D3 unseal stateless (DTN out-of-order
    # tolerance; replay is custody-layer), D4 enumerated reasons - against a
    # self-contained KAT-anchored RFC 8439 ChaCha20-Poly1305 reference.
    # Properties K0 (RFC 8439 2.3.2/2.5.2/2.8.2 KATs, byte-exact), A1-A4
    # (exhaustive boundary sweeps + nonce discipline + stateless decrypt),
    # A5 100,000-iteration mutation stream under ASan/UBSan, seed 0x542.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build AEAD-boundary harness (ASan + UBSan)
        run: |
          gcc -std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined \
              -fno-sanitize-recover=all fuzz_aead_boundary.c -o fuzz_aead_boundary
      - name: Run KATs + exhaustive sweeps + 100k-iteration fuzz stream
        run: ./fuzz_aead_boundary | tee fuzz_aead.log
      - name: Assert anchors (deterministic seed 0x542)
        run: |
          grep -q "iters=100000 accepted=100000 rejects=100000" fuzz_aead.log
          grep -q "ALL PROPERTIES PASS (K0,A1-A5), coverage complete" fuzz_aead.log
          grep -q "RFC 8439 KATs pass" fuzz_aead.log
          echo "aead-boundary gate: KATs exact, exhaustive sweeps clean, 100000 iterations, 0 crashes"

  secret-canary:
    # ITER-22 VAL: value-level read-back of the ITER22_VAL_CANARY repo
    # secret written via the API (scripts/iter22_secret_val.py, PUT 201
    # libsodium sealed box; ITER19 canary deleted after this run is green,
    # DELETE 204 - one-iteration TTL policy, VAL-007, tenth consecutive
    # rotation).  GitHub never
    # returns secret values over the API, so this runtime check is the
    # value-level half of the write/read validation.  Coupling note (recorded
    # ITER-14): this reference must rotate with the secret in the same
    # iteration - the ITER-14 push run 40337698971 failed this job exactly
    # once when the rotation preceded the reference update; the ITER-16 and
    # ITER-19 rotations applied the zero-failed-run order (write NEW first,
    # update this reference second, delete OLD third - each step CI-safe).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: check
        env:
          CANARY: ${{ secrets.ITER22_VAL_CANARY != '' }}
        run: |
          if [ "$CANARY" = "true" ]; then
            echo "ITER22_VAL_CANARY present and non-empty in Actions runtime"
          else
            echo "FAIL: ITER22_VAL_CANARY missing"; exit 1
          fi

  proverif-verify:
    # ITER-11 FV: re-run the ProVerif formal models (ESS outsider/insider +
    # FW-003/004 SOS-ACK) from the private repo's sim/proverif/ in CI, with
    # the open-source toolchain (ProVerif 2.05, Alpine static musl build,
    # no root).  Verdict lines must match the committed ess_verdict.txt -
    # stale-model / stale-verdict detection per task.md ("CI must detect
    # stale model inputs or missing proof/test runs").
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private AegisMesh (sim/proverif only)
        uses: actions/checkout@v4
        with:
          repository: drey123/Aegismesh
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: Aegismesh
          sparse-checkout: sim/proverif
      - name: Install ProVerif 2.05 (open-source static musl build)
        run: |
          mkdir -p /tmp/pv && cd /tmp/pv
          curl -sL -o proverif.apk https://dl-cdn.alpinelinux.org/alpine/edge/testing/x86_64/proverif-2.05-r1.apk
          curl -sL -o musl.apk https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/musl-1.2.6-r6.apk
          mkdir -p rootfs
          tar -xzf proverif.apk -C rootfs
          tar --warning=no-unknown-keyword -xzf musl.apk -C rootfs
          chmod +x rootfs/usr/bin/proverif rootfs/lib/ld-musl-x86_64.so.1
          echo "PV=/tmp/pv/rootfs/lib/ld-musl-x86_64.so.1 --library-path /tmp/pv/rootfs/lib /tmp/pv/rootfs/usr/bin/proverif" >> "$GITHUB_ENV"
      - name: Run ESS outsider model
        run: |
          cd Aegismesh/sim/proverif
          $PV -in pitype ess_outsider.pv > outsider.log
          grep -q "^RESULT not attacker_p2(m1\[\]) is true\.$" outsider.log
          grep -q "^RESULT not attacker_p2(destId\[\]) is true\.$" outsider.log
          grep -q "^RESULT not attacker_p2(m2\[\]) is true\.$" outsider.log
          test "$(grep -c '^RESULT' outsider.log)" -eq 7
          test "$(grep '^RESULT' outsider.log | grep -c 'is true\.$')" -eq 7
      - name: Run ESS insider model (epoch-key compromise)
        run: |
          cd Aegismesh/sim/proverif
          $PV -in pitype ess_insider.pv > insider.log
          grep -q "^RESULT not attacker_p2(m1\[\]) is true\.$" insider.log
          grep -q "^RESULT not attacker_p2(destId\[\]) is false\.$" insider.log
          grep -q "^RESULT not attacker_p2(m2\[\]) is true\.$" insider.log
          test "$(grep -c '^RESULT' insider.log)" -eq 9
          test "$(grep '^RESULT' insider.log | grep -c 'is true\.$')" -eq 4
          test "$(grep '^RESULT' insider.log | grep -c 'is false\.$')" -eq 3
      - name: Run SOS-ACK model (FW-003/FW-004)
        run: |
          cd Aegismesh/sim/proverif
          $PV -in pitype sosack.pv > sosack.log
          grep -q "^RESULT inj-event(srcAccept(m_4,s_4,r)) ==> inj-event(repAcked(m_4,s_4,r)) is true\.$" sosack.log
          grep -q "event(sosSent(m_4,s_4)) && event(repAcked(m_4,s_4,ra_2)) && event(repAcked(m_4,s_4,rb_2)) is true\.$" sosack.log
          test "$(grep -c '^RESULT' sosack.log)" -eq 2
      - name: Run capsule-opacity model (SEC-004/RT-013, ITER-18 FV-002 extension)
        run: |
          cd Aegismesh/sim/proverif
          $PV -in pitype capsule_opacity.pv > capsule.log
          grep -q "^RESULT not attacker_p2(m1\[\]) is true\.$" capsule.log
          grep -q "^RESULT not attacker_p2(destId\[\]) is true\.$" capsule.log
          grep -q "^RESULT not attacker_p2(m2\[\]) is true\.$" capsule.log
          grep -q "^RESULT event(bridgedOut(x_6)) ==> event(bridgedIn(x_6)) is true\.$" capsule.log
          test "$(grep -c '^RESULT' capsule.log)" -eq 8
          test "$(grep '^RESULT' capsule.log | grep -c 'is true\.$')" -eq 8
      - name: Run group-epoch PCS model (SEC-005, ITER-18 FV-002 extension)
        run: |
          cd Aegismesh/sim/proverif
          $PV -in pitype group_epoch.pv > group.log
          grep -q "^RESULT not attacker(m2\[\]) is true\.$" group.log
          grep -q "^RESULT not attacker(destIdG\[\]) is true\.$" group.log
          grep -q "^RESULT inj-event(acceptedE2G(x_1)) ==> inj-event(sentE2G(x_1)) is true\.$" group.log
          grep -q "^RESULT inj-event(certAccepted(x_1)) ==> inj-event(certSigned(x_1)) is true\.$" group.log
          test "$(grep -c '^RESULT' group.log)" -eq 4
          test "$(grep '^RESULT' group.log | grep -c 'is true\.$')" -eq 4
      - name: Assert all verdict lines match committed ess_verdict.txt
        run: |
          cd Aegismesh/sim/proverif
          # every RESULT line in a fresh run must appear in the committed verdict file
          for f in outsider insider sosack; do
            grep "^RESULT" $f.log | while read -r line; do
              grep -qF "$line" ess_verdict.txt || { echo "STALE VERDICT: $line"; exit 1; }
            done
          done
          # ITER-18 FV-002 extension: the two new models anchor against fv2_extension_verdict.txt
          for f in capsule group; do
            grep "^RESULT" $f.log | while read -r line; do
              grep -qF "$line" fv2_extension_verdict.txt || { echo "STALE VERDICT: $line"; exit 1; }
            done
          done
          echo "proverif-verify: 5 models, 30 verdict lines, all match committed anchors"

  pqc-kat:
    # ITER-12 PQ-001: pinned ML-KEM-768 implementation gate.  Clones
    # mlkem-native at the pinned tag, asserts the pinned commit SHA, builds
    # the portable C90 core (the exact code path the Cortex-M33/STM32U5
    # runs - no native backend exists for Armv8-M Mainline), and re-runs:
    # deterministic NIST KATs (digest-pinned), functional/unit tests,
    # official ACVP v1.1.0.43 vectors, and a valgrind secret-taint
    # constant-time screen on the ML-KEM-768 unit test (sk + randomness
    # marked secret upstream via MLK_CT_TESTING_SECRET).  Any build drift,
    # vector failure, or secret-dependent branch/memory access fails CI.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install valgrind + libc debug symbols
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind libc6-dbg
      - name: Clone mlkem-native at pinned revision
        run: |
          git clone --depth 1 --branch v2.0.0 https://github.com/pq-code-package/mlkem-native.git /tmp/mln
          cd /tmp/mln
          echo "revision: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "d1b2fe782888bdb761a50336012923180be7f502" || { echo "PIN MISMATCH"; exit 1; }
      - name: KAT + functional + unit (digest-pinned)
        run: |
          cd /tmp/mln
          make -j"$(nproc)" run_kat run_func run_unit
      - name: Official ACVP vectors (v1.1.0.43)
        run: |
          cd /tmp/mln
          make run_acvp
      - name: Constant-time screen (valgrind secret-taint, ML-KEM-768)
        run: |
          cd /tmp/mln
          valgrind --error-exitcode=99 test/build/mlkem768/bin/test_unit768
          echo "CT screen clean: no secret-dependent branches/memory accesses on the decaps path"

  gate:
    runs-on: ubuntu-latest
    needs: selfcontained
    timeout-minutes: 5
    outputs:
      has_pat: ${{ steps.check.outputs.has_pat }}
    steps:
      - id: check
        env:
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
        run: echo "has_pat=${HAS_PAT}" >> "$GITHUB_OUTPUT"

  full-sim:
    needs: [selfcontained, gate]
    if: needs.gate.outputs.has_pat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1) the PUBLIC repo itself (ci-smoke.sh + fixtures) - VAL-004 fix:
      #    run 40228846904 failed because the job checked out only the
      #    private repo and the fixtures were never in the workspace.
      - uses: actions/checkout@v4
      # 2) the PRIVATE repo sim/ (source of truth for the seeded sims)
      - name: Checkout private AegisMesh (sim only)
        uses: actions/checkout@v4
        with:
          repository: drey123/Aegismesh
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: Aegismesh
          sparse-checkout: sim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Run smoke gate against private sim/
        run: |
          cp ci-smoke.sh lr2021_peripheral.py slo_canary.py Aegismesh/sim/
          cd Aegismesh
          sh ../ci-smoke.sh
      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: Aegismesh/sim/results_iter*.json
          if-no-files-found: warn
